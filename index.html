<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a3a6b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Apps">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Apps</title>
<style>
  :root{
    color-scheme: light dark;
    --strip:#1a3a6b; --strip-ink:#d5dfef; --tab-hover:rgba(255,255,255,.13);
    --page:#f2f4f7; --ink:#1a2530; --ink-muted:#64707c; --surface:#ffffff; --border:#d6dce3; --accent:#b8720f; --accent-ink:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --strip:#0b0f14; --strip-ink:#a9b5c2; --tab-hover:rgba(255,255,255,.09);
      --page:#12161b; --ink:#e7eaee; --ink-muted:#96a2ad; --surface:#1b2129; --border:#333e4a; --accent:#e0a032; --accent-ink:#171207;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;}
  body{display:flex;flex-direction:column;height:100vh;height:100dvh;background:var(--strip);color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;font-size:14px;line-height:1.45;}
  [hidden]{display:none !important;}

  /* ---- the tab strip ---- */
  #tabs{flex:0 0 auto;display:flex;align-items:flex-end;gap:2px;background:var(--strip);
    padding:6px calc(8px + env(safe-area-inset-right)) 0 calc(8px + env(safe-area-inset-left));
    padding-top:calc(6px + env(safe-area-inset-top));}
  .tab{font:inherit;font-size:13px;font-weight:600;color:var(--strip-ink);background:transparent;border:0;
    border-radius:9px 9px 0 0;padding:9px 20px 10px;min-height:38px;min-width:0;max-width:240px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
  .tab:hover{background:var(--tab-hover);}
  /* the open tab takes the colour of the app under it, so the two read as one piece */
  .tab[aria-selected="true"]{background:var(--l);color:#1a2530;cursor:default;}
  @media (prefers-color-scheme: dark){ .tab[aria-selected="true"]{background:var(--d);color:#e7eaee;} }
  .tab:focus-visible, .strip-btn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
  .tab .short{display:none;}
  .spacer{flex:1 1 auto;}
  #buildTag{align-self:center;margin:0 6px 4px;font-size:11px;color:var(--strip-ink);opacity:.7;white-space:nowrap;}
  .strip-btn{align-self:center;margin-bottom:4px;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;
    border:0;border-radius:8px;background:transparent;color:var(--strip-ink);cursor:pointer;}
  .strip-btn:hover{background:var(--tab-hover);}
  /* a login with only one app gets that app full-screen, exactly as it looks on its own -
     and so does the page while nobody is signed in (one sign-in form, no tabs) */
  body.single #tabs{display:none;}
  /* a login with no app switched on: one message and nothing else */
  body.no-apps #tabs{display:none;}
  /* fingers need a bigger target than a mouse does */
  @media (pointer:coarse){
    .tab{min-height:44px;font-size:14px;padding-top:11px;padding-bottom:12px;}
    .strip-btn{width:40px;height:40px;}
  }
  @media (max-width:560px){
    #tabs{padding-left:calc(4px + env(safe-area-inset-left));padding-right:calc(4px + env(safe-area-inset-right));}
    .tab{flex:1 1 0;padding:10px 6px;min-height:44px;text-align:center;}
    .tab .long{display:none;} .tab .short{display:inline;}
    #buildTag{display:none;}
  }

  /* ---- one pane per app, stacked; only the open one shows. Kept in place (not
     removed) so each app holds its width and its place while another is open. ---- */
  #panes{flex:1 1 auto;position:relative;min-height:0;background:var(--page);}
  .pane{position:absolute;top:0;left:0;right:0;bottom:0;visibility:hidden;}
  .pane.active{visibility:visible;}
  .pane iframe{display:block;width:100%;height:100%;border:0;background:var(--page);}

  .msg{height:100%;overflow:auto;display:flex;align-items:center;justify-content:center;padding:24px 18px;background:var(--page);}
  .msg-card{max-width:560px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px 24px;}
  .msg-card h1{margin:0 0 8px;font-size:18px;}
  .msg-card p{margin:0 0 10px;color:var(--ink-muted);}
  .msg-card code{font-family:Consolas,"SF Mono",monospace;font-size:13px;color:var(--ink);word-break:break-all;}
  .msg-card button{font:inherit;font-weight:600;margin-top:6px;padding:9px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;}
</style>
</head>
<body class="single">

<div id="tabs" role="tablist" aria-label="Apps">
  <span class="spacer" id="tabSpacer"></span>
  <span id="buildTag" title="Build 6 - October 10, 2026">Build 6</span>
  <button type="button" class="strip-btn" id="reloadBtn" title="Reload this tab" aria-label="Reload this tab">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
  </button>
</div>
<div id="panes"><div class="msg" id="noApps" hidden><div class="msg-card"><h1>This login has no apps switched on - ask an Admin.</h1><p>An Admin switches the apps on for each login in the Equipment Database, under Manage users. Once that is done, sign out here and sign in again.</p><button type="button" id="noAppsOut">Sign out</button></div></div></div>

<script>
(function(){
  "use strict";

  // ---------- the apps ----------
  // path = where each app already lives on this same site (github.io address).
  // Nothing in the apps themselves is changed: each still works at its own
  // address. If a repository is ever renamed, its path here is the one thing
  // to change. light / dark = that app's own page colour, used for its tab.
  // login = that app's sign-in form, so this page can tell a tab is still
  // waiting for a sign-in that has since been made in another tab.
  var APPS = [
    {id: "database", name: "Database", short: "Database", path: "/Database/", light: "#f2f4f7", dark: "#12161b", login: "#cloudLogin"},
    {id: "install", name: "Install Tracker", short: "Install", path: "/Install-Tracker/", light: "#f4f1e9", dark: "#12161d", login: "#itLogin"},
    {id: "field", name: "Field Engineering", short: "Field Eng", path: "/FE/", light: "#e2efea", dark: "#0d1a17", login: "#login"}
  ];
  // Which tabs an account type gets (the Database's account types, as set in
  // its Manage users). Any type not listed here gets every tab. The first one
  // named is the tab that type opens on. This only decides what is SHOWN: each
  // app still enforces its own rules about who may open it.
  var TABS_FOR_ROLE = {
    driver: ["database"],                 // drivers: their deliveries page, full-screen, no tab strip
    dashboard: ["database", "install"],   // dashboard-view logins have no Field Engineering access
    fe: ["field", "install"],             // FE and FE Viewer have nothing in the Database
    fe_viewer: ["field", "install"]
  };
  // PC-FE, FE and FE Viewer are a marker (fe_kind) on top of the Database's
  // role: a PC-FE is a PC underneath, an FE and an FE Viewer are Viewers.
  var FE_KIND_ROLE = {pc_fe: "tech", fe: "viewer", fe_viewer: "viewer"};
  function accountType(row){
    var r = String((row && row.role) || "staff"), k = String((row && row.fe_kind) || "");
    return k && FE_KIND_ROLE[k] === r ? k : r;
  }
  // ---------- which apps a login has ----------
  // Since the job matrix every login has a level in EACH app, set in the
  // Database's Manage users, and the database answers one question about the
  // login that asks (ax_whoami): {db, it, fe: its level in the Database, the
  // Install Tracker and the Field Engineering Tracker - "none" = that app is
  // not switched on for it}. A tab is shown for each app the login has, always
  // in the same order. This only decides what is SHOWN: each app still
  // enforces its own rules about who may open it.
  var WHO_LEVELS = {
    db: ["viewer", "participant", "staff", "driver", "dashboard"],
    it: ["viewer", "participant", "staff", "dashboard"],
    fe: ["viewer", "participant", "staff"]
  };
  // The answer as this page uses it: {tabs: which tabs, in order, dash: true
  // for a Dashboard login}. A level that is missing or not understood counts
  // as "not switched on". null = that wasn't an answer at all.
  function whoView(a){
    if (Array.isArray(a)) a = a[0];
    if (!a || typeof a !== "object" || (typeof a.db !== "string" && typeof a.it !== "string" && typeof a.fe !== "string")) return null;
    var has = function(k){ return WHO_LEVELS[k].indexOf(String(a[k] || "")) !== -1; };
    var tabs = [];
    if (has("db")) tabs.push("database");
    if (has("it")) tabs.push("install");
    if (has("fe")) tabs.push("field");
    // a Dashboard screen - in the Database or in the Install Tracker - is never signed out by the apps
    return {tabs: tabs, dash: a.db === "dashboard" || a.it === "dashboard"};
  }
  // The same, worked out from an account type: for a database from before the
  // job matrix (what this page went by up to Build 4, unchanged).
  function roleView(type){
    var list = type && TABS_FOR_ROLE[type];
    return {tabs: list && list.length ? list.slice() : APPS.map(function(a){ return a.id; }), dash: type === "dashboard"};
  }
  // What this device kept from last time. Only this build's own shape counts;
  // anything older is passed over, and the database is asked again.
  // The tabs stay in the order they were kept in: the first one is the tab the
  // login opens on, and for a database from before the job matrix that is not
  // always the first tab on the page (an FE or FE Viewer account opens on Field
  // Engineering, as it did up to Build 4). With the job matrix the order kept
  // is the page's own anyway. A tab this page doesn't have, or one named
  // twice, is dropped.
  function cleanKnown(k){
    if (!k || k.v !== 2 || !k.uid || !Array.isArray(k.tabs)) return null;
    var ids = APPS.map(function(a){ return a.id; });
    return {uid: String(k.uid), v: 2, tabs: k.tabs.filter(function(id, i){ return ids.indexOf(id) !== -1 && k.tabs.indexOf(id) === i; }), dash: k.dash === true};
  }
  // Is the database saying it doesn't have the question at all? Then the job
  // matrix hasn't been set up there yet (add-job-matrix.sql not run), and this
  // page asks the way it always has.
  function whoIsOldDatabase(status, body){
    return status === 404 || (!!body && body.code === "PGRST202");
  }
  function sameView(a, b){
    return a === b || (!!a && !!b && a.dash === b.dash && a.tabs.join() === b.tabs.join());
  }
  var K = {tab: "apps.tab", role: "apps.role", mx: "apps.mx"};
  var SW_CACHE = "apps-page-v6";   // the same name as CACHE in sw.js

  function $(id){ return document.getElementById(id); }
  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
  function byId(id){ for (var i = 0; i < APPS.length; i++) if (APPS[i].id === id) return APPS[i]; return null; }

  var active = null;      // id of the open tab
  var view = null;        // which tabs the signed-in login gets, when known: {tabs, dash} (null = nobody is signed in, or not known yet: no tabs - see allowedIds)
  var noApps = false;     // the "this login has no apps" message is up
  var lastUid = null;     // who is signed in, as last seen
  var epoch = 0;          // goes up every time the sign-in changes (in, out, or a different person)

  // ---------- who is signed in ----------
  // All three apps keep the Supabase sign-in in this browser's storage for the
  // site, which is why one sign-in covers them. This page only READS it, to
  // know when the sign-in changed and which account type to ask about.
  function currentSession(){
    try{
      for (var i = 0; i < localStorage.length; i++){
        var k = localStorage.key(i);
        if (!/^sb-.+-auth-token$/.test(k)) continue;
        var v = JSON.parse(localStorage.getItem(k) || "null");
        if (v && v.currentSession) v = v.currentSession;
        if (v && v.user && v.user.id && v.access_token) return {uid: String(v.user.id), token: String(v.access_token)};
      }
    }catch(e){}
    return null;
  }
  function observe(){
    var s = currentSession(), uid = s ? s.uid : null;
    if (uid !== lastUid){
      var fromNobody = !lastUid;
      lastUid = uid; epoch++;
      askedSince = 0; expired = false; roleTries = 0;   // (see "asking the database which apps the login has")
      if (!uid) dayReload();
      // Someone has just signed in (in one of the tabs, or in another window).
      // Any tab still sitting on its sign-in form is loaded again, so one
      // sign-in is all it takes. Looked at twice, a moment apart: the tab that
      // did the signing in needs that moment to put its own form away.
      if (uid){
        var at = epoch;
        setTimeout(function(){ catchUpTabs(at, false); }, 1200);
        // by the second look, a tab that is not on its sign-in form has caught
        // up by itself, so it needn't be loaded again when it is next clicked
        // (only when nobody was signed in before - otherwise it might still be
        // showing the previous person, and loading it again is the safe thing)
        setTimeout(function(){ catchUpTabs(at, fromNobody); }, 3500);
      }
    }
    refreshRole(s);
    return s;
  }
  // ---------- a fresh start every day ----------
  // The apps sign everyone (except a Dashboard login) out once the date has
  // changed, and reload themselves. When that has just happened this page
  // reloads too, so it also starts the day on its current build. Once a day at
  // most: it can't go round in circles.
  function today(){
    var d = new Date(), p = function(n){ return (n < 10 ? "0" : "") + n; };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  function dayReload(){
    if (lsGet("mkapps.dayOut") !== today() || lsGet("apps.dayReload") === today()) return;
    lsSet("apps.dayReload", today());
    // a moment for the app that did the signing out to finish its own reload
    setTimeout(function(){ try{ location.reload(); }catch(e){} }, 1500);
  }
  // A Dashboard login is never signed out, so its screen can stay up for
  // weeks. While one is signed in, this page looks for a newer build of
  // itself every ten minutes and reloads when there is one (once per build).
  // So does a screen left open with nobody signed in - all it has is a sign-in
  // form - unless someone has touched a page in the last minute.
  var lastBuildLook = Date.now();
  function buildCheck(){
    var now = Date.now();
    if (navigator.onLine === false || now - lastBuildLook < 10 * 60000) return;
    var st = null;
    try{ st = JSON.parse(lsGet("mkapps.signInDay") || "null"); }catch(e){}
    if (lastUid ? !((st && st.x) || (view && view.dash)) : now - (Number(lsGet("mkapps.lastActive")) || 0) < 60000) return;
    lastBuildLook = now;
    fetch("sw.js", {cache: "no-store"}).then(function(r){ return r.ok ? r.text() : ""; }).then(function(text){
      var m = /CACHE\s*=\s*["']([^"']+)["']/.exec(text || "");
      if (!m || m[1] === SW_CACHE) return;
      // once per build - and once more every 45 minutes if the reload came back as the old page
      var seen = null;
      try{ seen = JSON.parse(lsGet("mkapps.buildSeen.apps") || "null"); }catch(e){}
      if (seen && seen.b === m[1] && Date.now() - (Number(seen.t) || 0) < 45 * 60000) return;
      // the page itself must be the new one too (the two files can arrive a minute apart)
      return fetch(String(location.href).split("#")[0], {cache: "no-store"}).then(function(r){ return r.ok ? r.text() : ""; }).then(function(page){
        if (String(page || "").indexOf('"' + m[1] + '"') === -1) return;
        lsSet("mkapps.buildSeen.apps", JSON.stringify({b: m[1], t: Date.now()}));
        location.reload();
      });
    }).then(null, function(){});
  }
  function showsSignIn(app){
    try{
      var el = app.frame && app.login && app.frame.contentDocument && app.frame.contentDocument.querySelector(app.login);
      return !!el && !el.hidden;
    }catch(e){ return false; }
  }
  function catchUpTabs(at, settle){
    if (!lastUid || epoch !== at) return;   // the sign-in has changed again since: that change has its own look
    var ok = allowedIds();
    APPS.forEach(function(a){
      if (!a.frame || ok.indexOf(a.id) === -1) return;
      // (once per sign-in: open() marks it, so a tab that is starting up again - or that has turned
      // this login away and shows its form for that reason - is left alone at the second look)
      if (showsSignIn(a)){ if (a.epoch !== epoch) open(a); }
      else if (settle) a.epoch = epoch;
    });
  }

  // ---------- asking the database which apps the login has ----------
  // The same question the three apps ask after a sign-in (see "which apps a
  // login has" above), using the site's own config.js - the same file the apps
  // load.
  function cloudConfig(){
    var c = window.EQDB_CLOUD || window.ITDB_CLOUD || window.FET_CLOUD;
    return c && /^https?:\/\//.test(String(c.url || "")) && c.anonKey && !/^PASTE/.test(String(c.anonKey)) ? c : null;
  }
  // (If none could be loaded - no connection at that moment - it is looked for
  // again the next time it is needed, not given up on for the life of the page.)
  var configTry = null;
  function configReady(){
    if (configTry) return configTry;
    var mine = configTry = new Promise(function(done){
      var i = 0;
      (function next(){
        if (cloudConfig() || i >= APPS.length || location.protocol === "file:") return done(cloudConfig());
        var s = document.createElement("script");
        s.src = APPS[i++].path + "config.js";
        s.onload = s.onerror = function(){ if (s.parentNode) s.parentNode.removeChild(s); next(); };
        document.head.appendChild(s);
      })();
    }).then(function(c){ if (!c && configTry === mine) configTry = null; return c; });
    return mine;
  }
  configReady();
  var roleAsked = "";   // the sign-in token the question was last asked with
  var roleRetryAt = 0;  // when to ask again after a lookup that couldn't be reached (0 = no need)
  var roleTries = 0;    // how many times in a row the question went unanswered for this sign-in
  // While no tab is showing yet (signed in, but the login's apps are not known),
  // an unanswered question is asked again within seconds, a few times; after
  // that, and whenever the login's own tabs are showing, once a minute.
  function retryWait(){
    roleTries++;
    return !view && roleTries <= 6 ? 5000 : 60000;
  }
  // A question that gets no answer at all (a connection that stalls) is asked
  // again after this long. The first one is not given up on: if its answer
  // does come, it is taken.
  var WHO_WAIT_MS = 8000;
  // "Your sign-in has expired" (the open app renews it, and the question is
  // then asked again with the new one).
  var EXPIRED = "expired";
  // THE LAST RESORT, for someone who IS signed in. If the database still has
  // not said which apps the login has this long after it was first asked (the
  // question keeps failing, or gets no answer - not when the reply is "your
  // sign-in has expired"), every tab is offered, as it was up to Build 5, so
  // that nobody is left on one app with no way on. Each app still lets in only
  // the logins that have it. The tabs become the login's own the moment an
  // answer comes, and go when it signs out. A visitor - nobody signed in -
  // never gets them.
  var GUESS_AFTER_MS = 12000;
  var askedSince = 0;   // when the question was first asked for the login that is signed in (0 = not yet)
  var expired = false;  // the last reply was "your sign-in has expired"
  var guessOn = false;  // every tab is being offered as that last resort
  function guessNow(){
    return !!lastUid && !expired && askedSince > 0 && Date.now() - askedSince >= GUESS_AFTER_MS;
  }
  var known = null;     // {uid, v: 2, tabs, dash} as last answered; remembered on the device so the tabs are right at once next time
  try{ known = cleanKnown(JSON.parse(lsGet(K.role) || "null")); }catch(e){}
  // Yesterday's sign-in is still on this device and nobody has touched a page
  // for a while: the app that opens ends it (the apps' daily rule) - or carries
  // on with it (no connection; the site can't be reached; a Dashboard login).
  // Until one or the other has happened, for a few seconds, no tab is offered:
  // by the apps' own rule nobody is signed in today yet.
  var DAY_HOLD_MS = 20000, dayHoldFrom = 0;
  function dayOver(){
    var st = null;
    try{ st = JSON.parse(lsGet("mkapps.signInDay") || "null"); }catch(e){}
    if (!st || !st.d || st.d === today() || st.x || navigator.onLine === false || Date.now() - (Number(lsGet("mkapps.lastActive")) || 0) < 3 * 60000){ dayHoldFrom = 0; return false; }
    if (!dayHoldFrom) dayHoldFrom = Date.now();
    return Date.now() - dayHoldFrom < DAY_HOLD_MS;
  }
  function refreshRole(s){
    if (!s){ roleAsked = ""; roleRetryAt = 0; setView(null); return; }
    setView(known && known.uid === s.uid && !dayOver() ? known : null);
    if (roleAsked === s.token && !(roleRetryAt && Date.now() >= roleRetryAt)) return;
    if (roleAsked !== s.token) expired = false;   // (a renewed sign-in: not known to have expired)
    if (!askedSince) askedSince = Date.now();
    roleAsked = s.token; roleRetryAt = 0;
    var answered = false;
    setTimeout(function(){
      // no answer at all so far: ask again (see WHO_WAIT_MS)
      if (!answered && lastUid === s.uid && roleAsked === s.token){ expired = false; if (!roleRetryAt) roleRetryAt = Date.now() + retryWait(); }
    }, WHO_WAIT_MS);
    configReady().then(function(c){
      if (!c) return null;
      return askWho(c, s).then(function(found){
        if (found !== OLD_DATABASE){ if (found && found !== EXPIRED && !lsGet(K.mx)) lsSet(K.mx, "1"); return found; }
        // (this device has had the job matrix's answer before: "not found" now is a hiccup, not an old database)
        if (lsGet(K.mx)) throw new Error("the question was not found");
        // an older database: the request this page has always made, and the tabs by account type
        return askOldDatabase(c, s).then(function(type){ return type ? roleView(type) : EXPIRED; });
      });
    }).then(function(found){
      answered = true;
      if (lastUid !== s.uid) return;
      // Couldn't tell: keep what is showing. While that is no tab at all, ask again shortly.
      if (!found || found === EXPIRED){
        if (roleAsked === s.token) expired = found === EXPIRED;
        if (!view) roleRetryAt = Date.now() + retryWait();
        return;
      }
      expired = false; roleTries = 0;
      known = {uid: s.uid, v: 2, tabs: found.tabs, dash: found.dash};
      lsSet(K.role, JSON.stringify(known));
      // a login with no app at all: look again in a minute, in case an Admin has just switched one on
      roleRetryAt = found.tabs.length ? 0 : Date.now() + 60000;
      if (!dayOver()) setView(known);   // (else: at the next look, once the day's sign-in has been settled)
    }, function(){
      answered = true;
      // couldn't be reached: ask again (see retryWait)
      if (lastUid === s.uid){ if (roleAsked === s.token) expired = false; roleRetryAt = Date.now() + retryWait(); }
    });
  }
  var OLD_DATABASE = "old";
  // Asks the database what the signed-in login has. Gives {tabs, dash};
  // OLD_DATABASE when the database doesn't have the question; EXPIRED when it
  // says the sign-in has expired. Uses the site's own config.js - the same file the
  // apps load.
  function askWho(c, s){
    return fetch(String(c.url).replace(/\/+$/, "") + "/rest/v1/rpc/ax_whoami",
      {method: "POST", headers: {apikey: c.anonKey, Authorization: "Bearer " + s.token, "Content-Type": "application/json", Accept: "application/json"}, body: "{}", cache: "no-store"})
      .then(function(r){
        if (r.status === 401) return EXPIRED;   // the sign-in has just expired: the open app renews it, and that asks again
        return r.json().then(null, function(){ return null; }).then(function(body){
          if (whoIsOldDatabase(r.status, body)) return OLD_DATABASE;
          if (!r.ok) throw new Error("status " + r.status);
          var v = whoView(body);
          if (!v) throw new Error("not an answer");
          return v;
        });
      });
  }
  // The request this page made up to Build 4, kept as it was: the login's
  // account type from the Database's eq_profiles. Gives the account type, or
  // null when it can't tell just now.
  function askOldDatabase(c, s){
    function ask(columns){
      return fetch(String(c.url).replace(/\/+$/, "") + "/rest/v1/eq_profiles?select=" + columns + "&id=eq." + encodeURIComponent(s.uid),
        {headers: {apikey: c.anonKey, Authorization: "Bearer " + s.token, Accept: "application/json"}, cache: "no-store"});
    }
    return ask("role,fe_kind").then(function(r){
        // a database from before the PC-FE / FE / FE Viewer types has no such column: ask the old way
        return r.status === 400 ? ask("role") : r;
      }).then(function(r){
        if (r.status === 401) return null;   // the sign-in has just expired: the open app renews it, and that asks again
        if (!r.ok) throw new Error("status " + r.status);
        return r.json();
      })
      // a login with no line in that table is treated as full access, as the apps treat it
      .then(function(rows){ return Array.isArray(rows) ? accountType(rows[0]) : null; });
  }
  // The app the page starts on: the one named in the address (#install), else
  // the one this device was on last, else the first.
  function startId(){
    var want = location.hash.replace(/^#/, "");
    if (byId(want)) return want;
    var last = lsGet(K.tab);
    return byId(last) ? last : APPS[0].id;
  }
  // The apps that may be opened. Tabs are only for a login that is signed in
  // and whose apps the database has named. Until then - nobody is signed in,
  // or the answer isn't here yet - it is ONE app: the one that is open (all it
  // shows is its own sign-in form), with no tab strip and no way from here to
  // the others. (The one exception is the last resort above: guessOn.)
  function allowedIds(){
    if (view) return view.tabs;
    if (guessOn) return APPS.map(function(a){ return a.id; });
    return [byId(active) ? active : startId()];
  }
  // A login with no app switched on: one message, no tabs, and nothing left
  // running behind it.
  function showNoApps(on){
    noApps = on;
    $("noApps").hidden = !on;
    document.body.classList.toggle("no-apps", on);
    if (!on) return;
    APPS.forEach(function(a){
      clearPane(a); a.epoch = -1;
      a.pane.classList.remove("active");
      a.tab.setAttribute("aria-selected", "false"); a.tab.tabIndex = -1;
    });
    active = null;
    document.title = "Apps";
  }
  function setView(v){
    var guess = !v && guessNow() && !dayOver();
    if (sameView(v, view) && guess === guessOn && (active || noApps)) return;
    var wasNoApps = noApps;
    view = v; guessOn = guess;
    var ok = allowedIds();
    // no tab is offered until the login's apps are known (see allowedIds)
    var strip = !!view || guessOn;
    APPS.forEach(function(a){ a.tab.hidden = !strip || ok.indexOf(a.id) === -1; });
    document.body.classList.toggle("single", !strip || ok.length === 1);
    showNoApps(!ok.length);
    if (!ok.length) return;
    if (active && ok.indexOf(active) === -1) activate(ok[0]);
    // coming from the "no apps" message: nothing is open yet, so open the tab this device was on last (or the first)
    else if (wasNoApps && !active) activate(lsGet(K.tab) || ok[0]);
  }

  // ---------- panes ----------
  function clearPane(app){ while (app.pane.firstChild) app.pane.removeChild(app.pane.firstChild); app.frame = null; }
  var SHOW_ANYWAY_MS = 2500;
  // Puts the app in its pane (first visit, or again after the sign-in changed).
  function open(app){
    clearPane(app);
    app.epoch = epoch;
    var f = document.createElement("iframe");
    f.title = app.name;
    f.setAttribute("allow", "camera; clipboard-write; fullscreen");
    f.src = app.path;
    // An app that hasn't been put on the site yet would show GitHub's "not found" page: say so plainly
    // instead. The app loads meanwhile, kept out of sight for the moment it takes to find out.
    f.style.visibility = "hidden";
    app.pane.appendChild(f);
    app.frame = f;
    fetch(app.path, {method: "HEAD", cache: "no-store"}).then(function(r){
      if (app.frame !== f) return;
      if (r.status === 404) showMissing(app); else f.style.visibility = "";
    }, function(){ f.style.visibility = ""; /* no connection: the app opens from its own offline copy */ });
    // (a request that neither answers nor fails must not leave an empty screen: the app shows after a moment anyway)
    setTimeout(function(){ if (app.frame === f) f.style.visibility = ""; }, SHOW_ANYWAY_MS);
  }
  function showMissing(app){
    clearPane(app);
    var box = document.createElement("div");
    box.className = "msg";
    box.innerHTML = '<div class="msg-card"><h1></h1><p>This tab looks for it at:</p><p><code></code></p>' +
      '<p>Upload it to GitHub at that address (its own build folder has the steps), then press Try again. The other tabs are not affected.</p>' +
      '<button type="button">Try again</button></div>';
    box.querySelector("h1").textContent = app.name + " isn't on the site yet";
    box.querySelector("code").textContent = location.origin + app.path;
    box.querySelector("button").addEventListener("click", function(){ open(app); });
    app.pane.appendChild(box);
  }

  function activate(id, focusIt){
    observe();
    var ok = allowedIds();
    if (!ok.length) return;   // this login has no app: the message is showing instead
    var app = byId(id);
    if (!app || ok.indexOf(app.id) === -1) app = byId(ok[0]);
    var prev = byId(active);
    // Only the open tab can be signed in to or out of, so whatever the sign-in is as we leave it is what it is showing.
    if (prev && prev !== app && prev.frame && !showsSignIn(prev)) prev.epoch = epoch;
    active = app.id;
    // First visit - or the sign-in changed since this tab was last looked at, so what it shows is stale.
    if (!app.pane.firstChild || (app.frame && app.epoch !== epoch)) open(app);
    APPS.forEach(function(a){
      var on = a === app;
      a.tab.setAttribute("aria-selected", on ? "true" : "false");
      a.tab.tabIndex = on ? 0 : -1;
      a.pane.classList.toggle("active", on);
    });
    document.title = app.name + " - Apps";
    lsSet(K.tab, app.id);
    try{ history.replaceState(null, "", "#" + app.id); }catch(e){}
    if (focusIt && app.frame){ try{ app.frame.contentWindow.focus(); }catch(e){} }
  }

  // ---------- build the page ----------
  if (location.protocol === "file:"){
    // Opened straight from a folder on the PC: the apps can't share a sign-in that way.
    $("tabs").hidden = true;
    $("panes").innerHTML = '<div class="msg"><div class="msg-card"><h1>This page works once it is on GitHub</h1>' +
      '<p>It shows the three apps from the same site it is on, so it has to be uploaded next to them (see the read-me). Opening the file from a folder on the PC can\'t do that.</p></div></div>';
    return;
  }
  APPS.forEach(function(app){
    var t = document.createElement("button");
    t.type = "button"; t.className = "tab"; t.id = "tab-" + app.id;
    t.setAttribute("role", "tab"); t.setAttribute("aria-selected", "false"); t.setAttribute("aria-controls", "pane-" + app.id);
    t.style.setProperty("--l", app.light); t.style.setProperty("--d", app.dark);
    t.innerHTML = '<span class="long"></span><span class="short"></span>';
    t.querySelector(".long").textContent = app.name; t.querySelector(".short").textContent = app.short;
    t.title = app.name;
    t.addEventListener("click", function(){ activate(app.id, true); });
    $("tabs").insertBefore(t, $("tabSpacer"));
    var p = document.createElement("div");
    p.className = "pane"; p.id = "pane-" + app.id;
    p.setAttribute("role", "tabpanel"); p.setAttribute("aria-labelledby", t.id);
    $("panes").appendChild(p);
    app.tab = t; app.pane = p; app.frame = null; app.epoch = -1;
  });
  // left / right arrow keys step through the tabs, as in a browser
  $("tabs").addEventListener("keydown", function(ev){
    if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
    var shown = APPS.filter(function(a){ return !a.tab.hidden; });
    var i = shown.indexOf(byId(active));
    if (i === -1 || shown.length < 2) return;
    var next = shown[(i + (ev.key === "ArrowRight" ? 1 : shown.length - 1)) % shown.length];
    ev.preventDefault();
    activate(next.id);
    next.tab.focus();
  });
  // Reloads just the open tab (the app asks first if it has anything unsaved).
  $("reloadBtn").addEventListener("click", function(){
    var app = byId(active);
    if (!app) return;
    if (!app.frame){ open(app); return; }
    try{ app.frame.contentWindow.location.reload(); }catch(e){ open(app); }
  });

  // On the "no apps" message no app is open that could sign out, so this page
  // does it - the one time it changes the sign-in rather than reads it. What
  // the browser keeps of the sign-in is removed (the apps treat that as
  // "signed out"), and the page is back to one app's sign-in form, no tabs.
  $("noAppsOut").addEventListener("click", function(){
    try{
      var gone = [];
      for (var i = 0; i < localStorage.length; i++){
        var k = localStorage.key(i);
        if (k && /^sb-.+-auth-token(-code-verifier)?$/.test(k)) gone.push(k);
      }
      gone.forEach(function(k){ localStorage.removeItem(k); });
    }catch(e){}
    observe();
  });

  // the sign-in changed in one of the apps (or in another window): look again
  window.addEventListener("storage", function(ev){ if (!ev.key || ev.key === "mkapps.signInDay" || /^sb-.+-auth-token$/.test(ev.key)) observe(); });
  // ...and when the page comes back to the front (a tablet waking, the Back
  // button), or the connection comes back - then a question that was waiting
  // to be asked again is asked at once
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) observe(); });
  window.addEventListener("pageshow", function(){ observe(); });
  window.addEventListener("focus", function(){ observe(); });
  window.addEventListener("online", function(){ if (roleRetryAt) roleRetryAt = Date.now(); observe(); });
  setInterval(function(){ observe(); buildCheck(); }, 4000);
  window.addEventListener("hashchange", function(){
    var want = location.hash.replace(/^#/, "");
    if (byId(want) && want !== active) activate(want);
  });

  observe();
  var want = location.hash.replace(/^#/, "");
  activate(byId(want) ? want : startId());

  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
})();
</script>
</body></html>
